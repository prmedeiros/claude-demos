<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Treino — Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1F2F5;
    --surface:#FFFFFF;
    --surface-2:#F6F7F9;
    --border:#E1E4EA;
    --text:#1B1E24;
    --text-dim:#6B7280;
    --accent:#B9740F;
    --accent-soft:#FBEBD3;
    --ok:#15803D;
    --ok-soft:#DCFCE7;
    --rest:#D94A2B;
    --shadow: 0 1px 2px rgba(20,20,20,.04), 0 8px 24px -12px rgba(20,20,20,.12);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15181D;
      --surface:#1D2128;
      --surface-2:#252A32;
      --border:#333944;
      --text:#ECEEF1;
      --text-dim:#8B93A1;
      --accent:#E8A33D;
      --accent-soft:#3A2E17;
      --ok:#34D399;
      --ok-soft:#173327;
      --rest:#FF7A5C;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#15181D;
    --surface:#1D2128;
    --surface-2:#252A32;
    --border:#333944;
    --text:#ECEEF1;
    --text-dim:#8B93A1;
    --accent:#E8A33D;
    --accent-soft:#3A2E17;
    --ok:#34D399;
    --ok-soft:#173327;
    --rest:#FF7A5C;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding-bottom:96px;
    min-height:100vh;
  }
  .wrap{max-width:560px; margin:0 auto; padding:20px 16px 8px;}

  header.top{padding:4px 4px 18px;}
  .eyebrow{
    font-family:'Oswald', 'Arial Narrow', sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:.04em;
    color:var(--accent);
    margin:0 0 2px;
  }
  h1{
    font-family:'Oswald', 'Arial Narrow', sans-serif;
    font-weight:700;
    font-size:30px;
    line-height:1.05;
    margin:0 0 6px;
    letter-spacing:-.01em;
  }
  .sub{
    font-size:14px;
    color:var(--text-dim);
    line-height:1.5;
    max-width:46ch;
  }
  .reset-all{
    background:none; border:none; color:var(--text-dim);
    font-size:12.5px; text-decoration:underline; text-underline-offset:2px;
    padding:6px 0; margin-top:10px; cursor:pointer; font-family:inherit;
  }

  .tabs{
    display:flex; gap:8px; overflow-x:auto; padding:2px 2px 14px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    font-family:'Oswald', 'Arial Narrow', sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:.02em;
    padding:10px 16px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-dim);
    cursor:pointer;
    transition:background .15s, color .15s, border-color .15s;
    scroll-snap-align:start;
  }
  .tab.active{
    background:var(--text);
    color:var(--bg);
    border-color:var(--text);
  }

  .day-note{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:16px;
  }
  .day-title-row{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:6px;}
  .day-title{
    font-family:'Oswald', 'Arial Narrow', sans-serif;
    font-weight:700;
    font-size:19px;
  }
  .day-focus{font-size:12.5px; color:var(--text-dim); margin-top:1px;}
  .day-desc{font-size:13.5px; color:var(--text-dim); line-height:1.5;}

  .progress-row{display:flex; align-items:center; gap:10px; margin:2px 0 16px;}
  .progress-track{flex:1; height:6px; border-radius:99px; background:var(--border); overflow:hidden;}
  .progress-fill{height:100%; background:var(--ok); border-radius:99px; transition:width .25s ease;}
  .progress-label{font-size:12px; color:var(--text-dim); font-variant-numeric:tabular-nums; white-space:nowrap;}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 16px 16px;
    margin-bottom:10px;
    box-shadow:var(--shadow);
  }
  .card-head{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:11px;}
  .ex-name{font-size:15px; font-weight:600; line-height:1.3;}
  .ex-reps{font-size:12.5px; color:var(--accent); font-weight:600; white-space:nowrap; flex:0 0 auto;}

  .weight-row{display:flex; align-items:center; gap:8px; margin-bottom:12px;}
  .weight-label{font-size:12px; color:var(--text-dim); flex:1;}
  .weight-step{
    width:28px; height:28px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:16px; line-height:1;
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-family:inherit;
    flex:0 0 auto;
  }
  .weight-step:active{transform:scale(.9);}
  .weight-input{
    width:56px; text-align:center; padding:6px 4px; border-radius:8px;
    border:1px solid var(--border); background:var(--surface-2); color:var(--text);
    font-family:'Oswald','Arial Narrow',sans-serif; font-weight:600; font-size:14px;
    flex:0 0 auto;
  }
  .weight-input:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}
  .weight-unit{font-size:12px; color:var(--text-dim); flex:0 0 auto;}

  .sets-row{display:flex; flex-wrap:wrap; gap:9px;}
  .set{
    width:42px; height:42px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Oswald','Arial Narrow',sans-serif;
    font-weight:600; font-size:14px;
    border:2px solid var(--border);
    background:var(--surface-2);
    color:var(--text-dim);
    cursor:pointer;
    user-select:none;
    transition:transform .12s ease, background .15s, border-color .15s, color .15s;
  }
  .set:active{transform:scale(.92);}
  .set.warmup{border-style:dashed; font-size:10px;}
  .set.work{border-color:var(--accent); color:var(--accent);}
  .set.done{
    background:var(--ok); border-color:var(--ok); color:#fff;
    transform:scale(1.02);
  }
  .set.warmup.done{background:var(--text-dim); border-color:var(--text-dim); color:var(--bg);}

  .dur-toggle{
    width:100%; text-align:left;
    padding:12px 14px; border-radius:10px;
    border:2px dashed var(--border);
    background:var(--surface-2);
    color:var(--text-dim);
    font-family:'Inter',sans-serif; font-weight:600; font-size:14px;
    cursor:pointer;
  }
  .dur-toggle.done{
    background:var(--ok-soft); border:2px solid var(--ok); color:var(--ok);
    border-style:solid;
  }

  .day-reset{
    display:block; width:100%; text-align:center;
    margin-top:6px; padding:12px;
    background:none; border:1px dashed var(--border);
    border-radius:12px; color:var(--text-dim);
    font-family:inherit; font-size:13px; cursor:pointer;
  }

  .abs-note{margin-bottom:14px;}
  .abs-switch{display:flex; gap:8px; margin-bottom:16px;}
  .abs-switch button{
    flex:1; padding:10px; border-radius:10px;
    font-family:'Oswald','Arial Narrow',sans-serif; font-weight:600; font-size:13.5px;
    border:1px solid var(--border); background:var(--surface); color:var(--text-dim); cursor:pointer;
  }
  .abs-switch button.active{background:var(--accent); border-color:var(--accent); color:#1B1000;}

  /* rest timer bar */
  .timer-bar{
    position:fixed; left:0; right:0; bottom:0;
    display:flex; align-items:center; gap:12px;
    padding:12px 16px calc(14px + env(safe-area-inset-bottom));
    background:var(--text); color:var(--bg);
    transform:translateY(120%);
    transition:transform .25s ease;
    z-index:20;
  }
  .timer-bar.show{transform:translateY(0);}
  .timer-bar.flash{background:var(--ok); color:#fff;}
  .ring{width:38px; height:38px; flex:0 0 auto;}
  .timer-info{flex:1; min-width:0;}
  .timer-label{font-size:11px; opacity:.65; letter-spacing:.02em;}
  .timer-ex{font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .timer-time{
    font-family:'Oswald','Arial Narrow',sans-serif; font-weight:700; font-size:20px;
    font-variant-numeric:tabular-nums; flex:0 0 auto;
  }
  .timer-skip{
    flex:0 0 auto; background:rgba(255,255,255,.14); border:none; color:inherit;
    width:34px; height:34px; border-radius:50%; font-size:15px; cursor:pointer;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .timer-bar{background:var(--surface-2); color:var(--text);}
    :root:not([data-theme="light"]) .timer-skip{background:var(--border);}
  }
  :root[data-theme="dark"] .timer-bar{background:var(--surface-2); color:var(--text);}
  :root[data-theme="dark"] .timer-skip{background:var(--border);}

  ::selection{background:var(--accent-soft);}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <p class="eyebrow">Bloco de treino</p>
    <h1>Treinos da semana</h1>
    <p class="sub">Toque em cada série ao concluí-la. O descanso de 1 minuto começa sozinho.</p>
    <button class="reset-all" id="resetAllBtn">Resetar todo o progresso</button>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <main id="panel"></main>
</div>

<div class="timer-bar" id="timerBar">
  <svg class="ring" viewBox="0 0 40 40">
    <circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-width="4"/>
    <circle id="ringProgress" cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="4"
      stroke-linecap="round" stroke-dasharray="106.8" stroke-dashoffset="0"
      transform="rotate(-90 20 20)"/>
  </svg>
  <div class="timer-info">
    <div class="timer-label" id="timerLabel">DESCANSO</div>
    <div class="timer-ex" id="timerEx">—</div>
  </div>
  <div class="timer-time" id="timerTime">1:00</div>
  <button class="timer-skip" id="timerSkip" title="Pular descanso">✕</button>
</div>

<script>
(function(){
  "use strict";

  var DAYS = [
    {
      id:'sexta', short:'SEX', day:'Sexta-feira', title:'Peito & Ombro', focus:'Anterior / Lateral',
      note:'Foco em empurrar. Séries de aquecimento devem ser feitas com 50–70% da carga final.',
      exercises:[
        {name:'Supino Inclinado com Halter', warmup:2, work:3, reps:'8–10'},
        {name:'Supino Reto (Máquina ou Halter)', warmup:0, work:3, reps:'8–10'},
        {name:'Crossover / Crucifixo na Polia (Polia Alta)', warmup:0, work:3, reps:'10–12'},
        {name:'Desenvolvimento com Halter ou Máquina', warmup:1, work:3, reps:'8–10'},
        {name:'Elevação Lateral na Polia', warmup:0, work:3, reps:'10–12'},
        {name:'Elevação Lateral com Halteres', warmup:0, work:2, reps:'10–12'}
      ]
    },
    {
      id:'sabado', short:'SÁB', day:'Sábado', title:'Pernas', focus:'+ Corrida',
      note:'Foco em força, estabilidade de quadril/joelhos e condicionamento.',
      exercises:[
        {name:'Leg Press 45°', warmup:1, work:3, reps:'10'},
        {name:'Stiff com Barra ou Halter', warmup:0, work:3, reps:'10–12'},
        {name:'Cadeira Extensora', warmup:0, work:3, reps:'12–15'},
        {name:'Cadeira Flexora', warmup:0, work:3, reps:'10–12'},
        {name:'Panturrilha em Pé ou Sentado', warmup:0, work:4, reps:'12–15'},
        {name:'Corrida na Esteira', duration:true, durationText:'15–25 min · alterne ritmo contínuo e HIIT/tiros a cada semana'}
      ]
    },
    {
      id:'domingo', short:'DOM', day:'Domingo', title:'Costas', focus:'Deltoide Posterior & Trapézio',
      note:'Exercícios com suporte para preservar a lombar pós-Stiff.',
      exercises:[
        {name:'Barra Fixa (Pronada ou Supinada)', warmup:0, work:3, failure:true},
        {name:'Puxada Alta na Polia (Pulldown)', warmup:0, work:3, reps:'10–12'},
        {name:'Remada Baixa Triângulo ou Articulada', warmup:0, work:3, reps:'10–12'},
        {name:'Crucifixo Invertido (Máquina ou Polia)', warmup:0, work:3, reps:'12'},
        {name:'Face Pull na Polia', warmup:0, work:3, reps:'12–15'}
      ]
    },
    {
      id:'segunda', short:'SEG', day:'Segunda-feira', title:'Braços', focus:'Bíceps, Tríceps & Antebraço',
      note:'Último treino do bloco. Aplique alta intensidade — drop-set na última série de cada exercício, se desejar.',
      exercises:[
        {name:'Tríceps Pulley com Corda ou Barra', warmup:1, work:3, reps:'10–12'},
        {name:'Tríceps Testa ou Mergulho/Dips', warmup:0, work:3, reps:'8–10'},
        {name:'Rosca Direta (Barra W ou Polia)', warmup:1, work:3, reps:'8–10'},
        {name:'Rosca Halter Martelo', warmup:0, work:3, reps:'10–12'},
        {name:'Rosca Inversa', warmup:0, work:3, reps:'12–15'}
      ]
    }
  ];

  var ABS = {
    id:'abs', short:'ABS',
    note:'Alterne Treino A e Treino B a cada sessão (dia sim, dia não), nos intervalos de terça a quinta — dias de descanso total do treino de força, com foco nos estudos e na recuperação articular.',
    variants:{
      a:{ label:'Treino A', exercises:[
        {name:'Abdominal Infra (Bola Bosu)', warmup:0, work:3, reps:'10–15'},
        {name:'Abdominal Supra (Máquina)', warmup:0, work:8, reps:'12'},
        {name:'Abdominal Rolinho', warmup:0, work:3, failure:true}
      ]},
      b:{ label:'Treino B', exercises:[
        {name:'Abdominal Canivete', warmup:0, work:3, reps:'15'},
        {name:'Abdominal Supra (Bola Pilates)', warmup:0, work:3, reps:'12–15'},
        {name:'Prancha', warmup:0, work:3, failure:true}
      ]}
    }
  };

  var STORE_KEY = 'treino_tracker_v1';
  var state = {done:{}, weights:{}, activeTab:'sexta', absVariant:'a'};
  try{
    var saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if(saved && typeof saved === 'object'){
      state.done = saved.done || {};
      state.weights = saved.weights || {};
      state.activeTab = saved.activeTab || 'sexta';
      state.absVariant = saved.absVariant || 'a';
    }
  }catch(e){}

  function persist(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
  }

  // ---------- timer ----------
  var timerBar = document.getElementById('timerBar');
  var ringProgress = document.getElementById('ringProgress');
  var timerTime = document.getElementById('timerTime');
  var timerEx = document.getElementById('timerEx');
  var timerSkip = document.getElementById('timerSkip');
  var RING_LEN = 106.8;
  var timerEnd = 0, timerInterval = null, audioCtx = null;

  function beep(){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var t0 = audioCtx.currentTime;
      [0, .16, .32].forEach(function(off){
        var o = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        o.type = 'sine';
        o.frequency.value = 880;
        g.gain.value = 0.001;
        o.connect(g); g.connect(audioCtx.destination);
        g.gain.setValueAtTime(0.0001, t0+off);
        g.gain.exponentialRampToValueAtTime(0.18, t0+off+0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t0+off+0.14);
        o.start(t0+off); o.stop(t0+off+0.15);
      });
    }catch(e){}
    if(navigator.vibrate){ try{ navigator.vibrate([120,60,120]); }catch(e){} }
  }

  function tick(){
    var remaining = Math.max(0, timerEnd - Date.now());
    var secs = Math.ceil(remaining/1000);
    var m = Math.floor(secs/60), s = secs%60;
    timerTime.textContent = m + ':' + (s<10?'0':'') + s;
    ringProgress.setAttribute('stroke-dashoffset', String(RING_LEN * (1 - remaining/60000)));
    if(remaining <= 0){
      clearInterval(timerInterval);
      timerInterval = null;
      timerBar.classList.add('flash');
      timerTime.textContent = '0:00';
      timerEx.textContent = 'Descanso concluído — bora pra próxima';
      beep();
      setTimeout(function(){
        timerBar.classList.remove('show');
        setTimeout(function(){ timerBar.classList.remove('flash'); }, 300);
      }, 1800);
    }
  }

  function startTimer(exName){
    timerBar.classList.remove('flash');
    timerEnd = Date.now() + 60000;
    timerEx.textContent = exName;
    timerBar.classList.add('show');
    if(timerInterval) clearInterval(timerInterval);
    tick();
    timerInterval = setInterval(tick, 250);
  }

  timerSkip.addEventListener('click', function(){
    if(timerInterval) clearInterval(timerInterval);
    timerInterval = null;
    timerBar.classList.remove('show','flash');
  });

  // ---------- rendering ----------
  var tabsEl = document.getElementById('tabs');
  var panelEl = document.getElementById('panel');

  function allTabs(){
    return DAYS.map(function(d){ return {id:d.id, short:d.short}; }).concat([{id:'abs', short:ABS.short}]);
  }

  function renderTabs(){
    tabsEl.innerHTML = '';
    allTabs().forEach(function(t){
      var b = document.createElement('button');
      b.className = 'tab' + (state.activeTab === t.id ? ' active' : '');
      b.textContent = t.short;
      b.addEventListener('click', function(){
        state.activeTab = t.id;
        persist();
        renderTabs();
        renderPanel();
      });
      tabsEl.appendChild(b);
    });
  }

  function keyFor(dayId, exIdx, kind, i){
    return dayId + '__' + exIdx + '__' + kind + i;
  }

  function computeProgress(dayId, exercises){
    var total = 0, done = 0;
    exercises.forEach(function(ex, i){
      if(ex.duration){
        total += 1;
        if(state.done[keyFor(dayId, i, 'd', 0)]) done += 1;
        return;
      }
      var n = (ex.warmup||0) + (ex.work||0);
      total += n;
      for(var w=0; w<(ex.warmup||0); w++){ if(state.done[keyFor(dayId,i,'w',w)]) done++; }
      for(var k=0; k<(ex.work||0); k++){ if(state.done[keyFor(dayId,i,'k',k)]) done++; }
    });
    return {total:total, done:done};
  }

  function trimNum(n){
    return (Math.round(n*10)/10).toString();
  }

  function buildWeightRow(dayId, exIdx){
    var wrap = document.createElement('div');
    wrap.className = 'weight-row';
    var wk = dayId + '__' + exIdx + '__wt';

    var label = document.createElement('span');
    label.className = 'weight-label';
    label.textContent = 'Último peso';

    var minus = document.createElement('button');
    minus.type = 'button'; minus.className = 'weight-step'; minus.textContent = '–';

    var input = document.createElement('input');
    input.className = 'weight-input';
    input.type = 'text';
    input.inputMode = 'decimal';
    input.placeholder = '—';
    input.value = state.weights[wk] || '';

    var plus = document.createElement('button');
    plus.type = 'button'; plus.className = 'weight-step'; plus.textContent = '+';

    var unit = document.createElement('span');
    unit.className = 'weight-unit';
    unit.textContent = 'kg';

    function save(v){
      state.weights[wk] = v;
      persist();
    }
    minus.addEventListener('click', function(){
      var cur = parseFloat((input.value||'0').replace(',','.')) || 0;
      cur = Math.max(0, cur - 2.5);
      input.value = trimNum(cur);
      save(input.value);
    });
    plus.addEventListener('click', function(){
      var cur = parseFloat((input.value||'0').replace(',','.')) || 0;
      cur = cur + 2.5;
      input.value = trimNum(cur);
      save(input.value);
    });
    input.addEventListener('input', function(){ save(input.value); });

    wrap.appendChild(label);
    wrap.appendChild(minus);
    wrap.appendChild(input);
    wrap.appendChild(plus);
    wrap.appendChild(unit);
    return wrap;
  }

  function buildExerciseCard(dayId, ex, exIdx){
    var card = document.createElement('div');
    card.className = 'card';

    var head = document.createElement('div');
    head.className = 'card-head';
    var name = document.createElement('div');
    name.className = 'ex-name';
    name.textContent = ex.name;
    head.appendChild(name);

    if(!ex.duration){
      var reps = document.createElement('div');
      reps.className = 'ex-reps';
      reps.textContent = ex.failure ? 'até a falha' : (ex.reps + ' reps');
      head.appendChild(reps);
    }
    card.appendChild(head);

    if(!ex.duration){
      card.appendChild(buildWeightRow(dayId, exIdx));
    }

    if(ex.duration){
      var note = document.createElement('div');
      note.style.fontSize = '12.5px';
      note.style.color = 'var(--text-dim)';
      note.style.marginBottom = '10px';
      note.textContent = ex.durationText;
      card.appendChild(note);

      var btn = document.createElement('button');
      var dk = keyFor(dayId, exIdx, 'd', 0);
      function refreshBtn(){
        var on = !!state.done[dk];
        btn.className = 'dur-toggle' + (on ? ' done' : '');
        btn.textContent = on ? '✓ Concluído' : 'Marcar como concluído';
      }
      refreshBtn();
      btn.addEventListener('click', function(){
        state.done[dk] = !state.done[dk];
        persist();
        refreshBtn();
        renderProgressOnly(dayId);
      });
      card.appendChild(btn);
      return card;
    }

    var row = document.createElement('div');
    row.className = 'sets-row';

    function makeCircle(kind, i, label){
      var c = document.createElement('div');
      var k = keyFor(dayId, exIdx, kind, i);
      c.className = 'set ' + (kind==='w' ? 'warmup' : 'work') + (state.done[k] ? ' done' : '');
      c.textContent = state.done[k] ? '✓' : label;
      c.addEventListener('click', function(){
        var nowDone = !state.done[k];
        state.done[k] = nowDone;
        persist();
        c.classList.toggle('done', nowDone);
        c.textContent = nowDone ? '✓' : label;
        renderProgressOnly(dayId);
        if(nowDone) startTimer(ex.name);
      });
      return c;
    }

    for(var w=0; w<(ex.warmup||0); w++){ row.appendChild(makeCircle('w', w, 'aq')); }
    for(var k=0; k<(ex.work||0); k++){ row.appendChild(makeCircle('k', k, String(k+1))); }

    card.appendChild(row);
    return card;
  }

  function progressBarHTML(prog){
    var pct = prog.total ? Math.round(100*prog.done/prog.total) : 0;
    var wrap = document.createElement('div');
    wrap.className = 'progress-row';
    wrap.innerHTML =
      '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>' +
      '<div class="progress-label">'+prog.done+'/'+prog.total+' séries</div>';
    return wrap;
  }

  function renderProgressOnly(dayId){
    var holder = document.getElementById('progHolder');
    if(!holder) return;
    var exercises;
    if(dayId === 'abs'){
      exercises = ABS.variants[state.absVariant].exercises;
    } else {
      exercises = DAYS.filter(function(d){return d.id===dayId;})[0].exercises;
    }
    var prog = computeProgress(dayId==='abs' ? dayId+'_'+state.absVariant : dayId, exercises);
    holder.innerHTML = '';
    holder.appendChild(progressBarHTML(prog));
  }

  function renderDayPanel(day){
    panelEl.innerHTML = '';

    var noteBox = document.createElement('div');
    noteBox.className = 'day-note';
    noteBox.innerHTML =
      '<div class="day-title-row"><div><div class="day-title">'+day.title+'</div>'+
      '<div class="day-focus">'+day.day+' · '+day.focus+'</div></div></div>'+
      '<div class="day-desc">'+day.note+'</div>';
    panelEl.appendChild(noteBox);

    var progHolder = document.createElement('div');
    progHolder.id = 'progHolder';
    panelEl.appendChild(progHolder);
    renderProgressOnly(day.id);

    day.exercises.forEach(function(ex, i){
      panelEl.appendChild(buildExerciseCard(day.id, ex, i));
    });

    var resetBtn = document.createElement('button');
    resetBtn.className = 'day-reset';
    resetBtn.textContent = 'Resetar ' + day.day.toLowerCase();
    resetBtn.addEventListener('click', function(){
      Object.keys(state.done).forEach(function(k){
        if(k.indexOf(day.id+'__') === 0) delete state.done[k];
      });
      persist();
      renderPanel();
    });
    panelEl.appendChild(resetBtn);
  }

  function renderAbsPanel(){
    panelEl.innerHTML = '';

    var noteBox = document.createElement('div');
    noteBox.className = 'day-note abs-note';
    noteBox.innerHTML =
      '<div class="day-title-row"><div><div class="day-title">Abdômen</div>'+
      '<div class="day-focus">Terça a quinta · descanso do treino de força</div></div></div>'+
      '<div class="day-desc">'+ABS.note+'</div>';
    panelEl.appendChild(noteBox);

    var switcher = document.createElement('div');
    switcher.className = 'abs-switch';
    ['a','b'].forEach(function(v){
      var b = document.createElement('button');
      b.textContent = ABS.variants[v].label;
      b.className = state.absVariant===v ? 'active' : '';
      b.addEventListener('click', function(){
        state.absVariant = v;
        persist();
        renderAbsPanel();
      });
      switcher.appendChild(b);
    });
    panelEl.appendChild(switcher);

    var progHolder = document.createElement('div');
    progHolder.id = 'progHolder';
    panelEl.appendChild(progHolder);
    renderProgressOnly('abs');

    var dayKey = 'abs_' + state.absVariant;
    ABS.variants[state.absVariant].exercises.forEach(function(ex, i){
      panelEl.appendChild(buildExerciseCard(dayKey, ex, i));
    });

    var resetBtn = document.createElement('button');
    resetBtn.className = 'day-reset';
    resetBtn.textContent = 'Resetar ' + ABS.variants[state.absVariant].label.toLowerCase();
    resetBtn.addEventListener('click', function(){
      Object.keys(state.done).forEach(function(k){
        if(k.indexOf(dayKey+'__') === 0) delete state.done[k];
      });
      persist();
      renderAbsPanel();
    });
    panelEl.appendChild(resetBtn);
  }

  function renderPanel(){
    if(state.activeTab === 'abs'){
      renderAbsPanel();
    } else {
      var day = DAYS.filter(function(d){ return d.id === state.activeTab; })[0] || DAYS[0];
      renderDayPanel(day);
    }
  }

  document.getElementById('resetAllBtn').addEventListener('click', function(){
    state.done = {};
    persist();
    renderPanel();
  });

  renderTabs();
  renderPanel();
})();
</script>
</body>
</html>
