<title>Jornada da Aprovação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: uma tela de RPG em coluna única. HUD do personagem no topo, navegação de dia, missão principal, missões diárias, tentações (vícios), atributos, mapa de semanas e chefões. */
:root{
  --bg:#110F22; --win:#1B1833; --win2:#2A2450; --ink:#F2EEDC; --muted:#AAA4CC; --line:#6A5DC0; --shadow:#06050F;
  --gold:#F5B942; --on-gold:#2A1D00; --hp:#F0525C; --ok:#46D9A2;
  --mente:#62AEFF; --espirito:#C8A2FF; --corpo:#FF915E; --oficio:#46D9A2;
  --f-pix:"Pixelify Sans","Courier New",ui-monospace,monospace;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#E7E0CB; --win:#FBF7E8; --win2:#EDE5CB; --ink:#241E40; --muted:#625A8A; --line:#4E43A0; --shadow:#C3B995;
    --gold:#E0A021; --on-gold:#2A1D00; --hp:#C92D39; --ok:#0A7A55;
    --mente:#1F6FD1; --espirito:#7B3FD1; --corpo:#B8420F; --oficio:#0A7A55;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#E7E0CB; --win:#FBF7E8; --win2:#EDE5CB; --ink:#241E40; --muted:#625A8A; --line:#4E43A0; --shadow:#C3B995;
  --gold:#E0A021; --on-gold:#2A1D00; --hp:#C92D39; --ok:#0A7A55;
  --mente:#1F6FD1; --espirito:#7B3FD1; --corpo:#B8420F; --oficio:#0A7A55;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:20px 90px;}
.app{max-width:720px;margin:0 auto;display:grid;gap:18px;}
button,input,select{font:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
.pix{font-family:var(--f-pix);letter-spacing:.03em;}
h1,h2,h3{font-family:var(--f-pix);margin:0;font-weight:700;letter-spacing:.04em;text-wrap:balance;}
h1{font-size:1.5rem;}
h2{font-size:1.05rem;text-transform:uppercase;color:var(--gold);}
.win{background:var(--win);border:3px solid var(--line);box-shadow:inset 0 0 0 2px var(--win2),5px 5px 0 var(--shadow);padding:16px;min-width:0;}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px 12px;flex-wrap:wrap;margin-bottom:12px;}
.sec-head .meta{font-family:var(--f-pix);color:var(--muted);font-size:.9rem;}

/* HUD */
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;}
.top .sub{color:var(--muted);font-size:.9rem;}
.hud{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center;}
.hero{background:var(--win2);border:3px solid var(--line);padding:8px;display:grid;place-items:center;}
.hero svg{width:100%;height:auto;max-width:80px;display:block;image-rendering:pixelated;}
.hud-main{display:grid;gap:10px;min-width:0;}
.who{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;}
.who .lvl{font-family:var(--f-pix);font-size:1.7rem;color:var(--gold);line-height:1;}
.who .title{font-family:var(--f-pix);font-size:1rem;}
.meter{display:grid;gap:3px;}
.meter .lab{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-pix);font-size:.82rem;color:var(--muted);flex-wrap:wrap;}
.meter .lab b{color:var(--ink);font-weight:500;}
.bar{height:16px;background:var(--bg);border:2px solid var(--line);position:relative;overflow:hidden;}
.bar i{display:block;height:100%;transition:width .35s steps(12);}
.bar.xp i{background:var(--gold);}
.bar.hp i{background:var(--hp);}
.bar.ok i{background:var(--ok);}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{font-family:var(--f-pix);font-size:.82rem;border:2px solid var(--line);padding:2px 8px;background:var(--win2);white-space:nowrap;}
.chip.hot{border-color:var(--gold);color:var(--gold);}
@media (max-width:480px){.hud{grid-template-columns:72px 1fr;gap:12px;}.hero{padding:4px;}}

/* navegação de dia */
.nav{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;}
.nav .mid{text-align:center;min-width:0;}
.nav .mid .d{font-family:var(--f-pix);font-size:1.15rem;}
.nav .mid .s{color:var(--muted);font-size:.85rem;}
.btn{font-family:var(--f-pix);background:var(--win2);border:3px solid var(--line);padding:6px 12px;min-height:44px;min-width:44px;box-shadow:3px 3px 0 var(--shadow);}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow);}
.btn[disabled]{opacity:.4;cursor:not-allowed;}
.btn.gold{background:var(--gold);color:var(--on-gold);border-color:var(--gold);}
.btn.bad{border-color:var(--hp);}
.subnav{display:flex;justify-content:center;margin-top:-6px;}

/* missão principal */
.mission{border-color:var(--gold);display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:center;}
.mission .tag{font-family:var(--f-pix);font-size:.8rem;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.mission h3{font-size:1.25rem;margin:2px 0 6px;}
.mission p{margin:0;white-space:pre-line;max-width:62ch;}
.mission .xp{font-family:var(--f-pix);color:var(--gold);margin-top:8px;display:block;}
.boss{background:var(--hp);color:#fff;font-family:var(--f-pix);font-size:.75rem;padding:1px 7px;letter-spacing:.08em;}

/* missões */
ul.quests{list-style:none;margin:0;padding:0;display:grid;gap:8px;}
.q{display:grid;grid-template-columns:44px 1fr auto 44px;gap:6px 8px;align-items:center;padding:6px 4px 6px 4px;border:2px solid var(--line);background:var(--win2);}
.q.done{opacity:.62;}
.q.done .qt{text-decoration:line-through;text-decoration-thickness:2px;}
.qtime{font-family:var(--f-pix);font-size:.8rem;color:var(--muted);}
.qt{font-weight:600;overflow-wrap:anywhere;}
.qn{display:block;color:var(--muted);font-size:.85rem;font-weight:400;}
.cat{display:inline-block;font-family:var(--f-pix);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;margin-right:6px;}
.c-mente{color:var(--mente);}.c-espirito{color:var(--espirito);}.c-corpo{color:var(--corpo);}.c-oficio{color:var(--oficio);}
.qxp{font-family:var(--f-pix);color:var(--gold);white-space:nowrap;font-size:.95rem;}
.miss{width:36px;height:36px;margin:4px;display:grid;place-items:center;border:3px solid var(--line);background:var(--bg);color:var(--muted);font-family:var(--f-pix);font-size:1rem;line-height:1;padding:0;}
.miss.on{background:var(--hp);border-color:var(--hp);color:#fff;}
.miss:disabled{opacity:.4;cursor:not-allowed;}
.q.miss-row{border-color:var(--hp);background:color-mix(in srgb,var(--hp) 14%,var(--win2));}
.q.miss-row .qt{color:var(--muted);}
.mission.missed{border-color:var(--hp);}
.mact{display:flex;flex-direction:column;align-items:center;gap:4px;}
.check{position:relative;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;}
.check input{appearance:none;-webkit-appearance:none;width:28px;height:28px;margin:0;border:3px solid var(--ink);background:var(--bg);cursor:pointer;display:grid;place-items:center;}
.check input:checked{background:var(--gold);border-color:var(--gold);}
.check input:checked::after{content:"";width:7px;height:14px;border:solid var(--on-gold);border-width:0 4px 4px 0;transform:rotate(45deg) translate(-1px,-1px);}
.check input:disabled{opacity:.4;cursor:not-allowed;}
.check.big input{width:40px;height:40px;}
.check.big input:checked::after{width:10px;height:20px;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
.note{color:var(--muted);font-size:.85rem;margin:10px 0 0;}
.dayxp{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-family:var(--f-pix);font-size:.9rem;}
.dayxp .g{color:var(--gold);}.dayxp .r{color:var(--hp);}

/* tentações */
.vices{list-style:none;margin:0;padding:0;display:grid;gap:8px;}
.v{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;border:2px solid var(--line);background:var(--win2);padding:8px 10px;}
.v .nm{font-weight:600;overflow-wrap:anywhere;}
.v .pen{font-family:var(--f-pix);color:var(--hp);font-size:.85rem;}
.v .acts{display:flex;gap:6px;align-items:center;}
.v .cnt{font-family:var(--f-pix);min-width:2ch;text-align:center;}
.vadd{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.vadd input[type=text]{flex:1 1 180px;min-width:0;background:var(--bg);border:3px solid var(--line);padding:8px 10px;min-height:44px;}
.vadd select{background:var(--bg);border:3px solid var(--line);padding:8px;min-height:44px;}
.x{background:transparent;border:0;color:var(--muted);min-width:44px;min-height:44px;font-family:var(--f-pix);}

/* atributos */
.attrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;}
.attr .lab{display:flex;justify-content:space-between;font-family:var(--f-pix);font-size:.9rem;margin-bottom:3px;}
.attr .bar i{background:currentColor;}

/* dívida */
.debt{list-style:none;margin:0;padding:0;display:grid;gap:8px;}
.debt li{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;border:2px solid var(--line);background:var(--win2);padding:8px 10px;}
.debt .when{font-family:var(--f-pix);font-size:.82rem;color:var(--muted);}
.debt .tx{display:block;font-size:.88rem;color:var(--muted);overflow-wrap:anywhere;}

/* mapa */
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px;}
.node{font-family:var(--f-pix);background:var(--win2);border:3px solid var(--line);padding:6px 2px;text-align:center;min-height:54px;display:grid;gap:0;align-content:center;}
.node b{font-size:1.1rem;font-weight:700;}
.node span{font-size:.72rem;color:var(--muted);}
.node.full{background:var(--gold);border-color:var(--gold);color:var(--on-gold);}
.node.full span{color:var(--on-gold);}
.node.cur{outline:3px solid var(--ink);outline-offset:2px;}
.node.lock{opacity:.55;}
.bosses{display:grid;gap:8px;margin-top:14px;}
.bosses div{display:flex;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;align-items:baseline;border:2px solid var(--hp);padding:8px 10px;background:var(--win2);}
.bosses .bn{font-weight:600;}
.bosses .bd{font-family:var(--f-pix);color:var(--hp);}

details.rules summary{cursor:pointer;font-family:var(--f-pix);color:var(--gold);}
details.rules ul{margin:10px 0 0;padding-left:20px;color:var(--muted);font-size:.92rem;display:grid;gap:6px;}
.foot{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;}
.status{font-family:var(--f-pix);font-size:.82rem;color:var(--muted);}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);opacity:0;pointer-events:none;background:var(--gold);color:var(--on-gold);border:3px solid var(--ink);font-family:var(--f-pix);font-size:1.1rem;padding:8px 18px;transition:opacity .15s,transform .15s;max-width:calc(100vw - 32px);text-align:center;z-index:10;}
.toast.show{opacity:1;transform:translate(-50%,0);}
.toast.neg{background:var(--hp);color:#fff;}
.toast.lvl{font-size:1.3rem;}
@media (prefers-reduced-motion: reduce){.bar i,.toast{transition:none;}}
</style>

DAYS.forEach((day,d) => day.items.forEach((text,i) => {

  const s = {d,k,key:d+'-'+k,subj:day.name,text,boss,xp:boss?120:80,date:addDays(START,7*(k-1)+d),time:STUDY_TIME[d]};
  SESS.push(s); SBK[s.key] = s; SBD[iso(s.date)] = s;

function questsFor(D){
  const list = LIFE[dow(D)].map(([id,time,title,note,cat,xp,side]) => ({kind:'life',id,time,title,note,cat,xp,side:!!side}));
  if (iso(D) <= CONSAG_END) list.push({kind:'life',id:'cs',time:'99:00',title:'Consagração a São José',note:'Até 31/10 · +'+CONSAG_BONUS+' XP de bônus no último dia',cat:'espirito',xp:25,side:true});
  const s = SBD[iso(D)];
  if (s) list.push({kind:'study',id:'S'+s.key,key:s.key,time:s.time,title:s.subj,note:s.text,cat:'mente',xp:s.xp,boss:s.boss});
  return list.sort((a,b) => a.time < b.time ? -1 : a.time > b.time ? 1 : (a.kind === 'study' ? -1 : 1));
}

/* estado */
const LS = 'jornada-aprovacao-v1';
function fresh(){ return {q:{},study:{},vice:{},viceDefs:DEFAULT_VICES.map(v => ({...v})),savedAt:0}; }
function normalize(s){
  const b = fresh(); s = s && typeof s === 'object' ? s : {};
  return {q:s.q||b.q, study:s.study||b.study, vice:s.vice||b.vice, viceDefs:(Array.isArray(s.viceDefs)&&s.viceDefs.length)?s.viceDefs:b.viceDefs, savedAt:s.savedAt||0};
}
let state;

/* cálculo central */
function compute(){
  const sums = {}, attr = {mente:0,espirito:0,corpo:0,oficio:0};
  let total = 0, streak = 0;
  const last = TODAY < START ? null : (TODAY > END ? END : TODAY);
  if (last){
    for (let D = START; D <= last; D = addDays(D,1)){
      const k = iso(D), qs = questsFor(D), qm = state.q[k] || {};
      let done = 0, missed = 0, count = 0; const base = [];
      qs.forEach(q => {
        const ok = q.kind === 'study' ? state.study[q.key] === k : qm[q.id] === 1;
        if (!q.side) count++;
        if (ok){ if (!q.side) done++; base.push([q.cat,q.xp]); }
        else if (qm[q.id] === 2 && !q.side) missed++;
      });
      Object.keys(state.study).forEach(key => {
        if (state.study[key] === k && SBK[key] && SBK[key].date < D) base.push(['mente',Math.round(SBK[key].xp*0.7)]);
      });
      const mult = 1 + Math.min(streak,10)*0.05;
      let earned = 0;
      base.forEach(([c,x]) => { const v = Math.round(x*mult); earned += v; attr[c] += v; });
      const vm = state.vice[k] || {};
      let pen = 0, hp = 0, vc = 0;
      state.viceDefs.forEach(v => { const n = vm[v.id] || 0; pen += n*v.xp; hp += n*v.hp; vc += n; });
      const perfect = count > 0 && done === count && vc === 0;
      const csFinal = k === CONSAG_END && qm['cs'] === 1;
      const bonus = (perfect ? 50 : 0) + (csFinal ? CONSAG_BONUS : 0);
      total += earned + bonus - pen;
      const qual = (count ? done/count >= 0.7 : true) && vc === 0;
      sums[k] = {earned,pen,bonus,done,count,missed,mult,hp:Math.max(0,100-hp),qual,vc,perfect,csFinal};
      if (D < TODAY) streak = qual ? streak+1 : 0;
    }
  }
  const ts = sums[iso(TODAY)];
  return {sums,attr,total:Math.max(0,total),streak,todayQual:!!(ts && ts.qual && ts.done>0)};
}
function levelInfo(T){
  let L = 1; while (T >= 60*(L+1)*L) L++;
  return {L,cur:60*L*(L-1),next:60*L*(L+1),title:TIERS[Math.min(TIERS.length-1,Math.floor((L-1)/3))]};
}
function attrInfo(x){ let L = 1; while (x >= 40*L*L) L++; return {L,cur:40*(L-1)*(L-1),next:40*L*L}; }

/* persistência */
let saving = false, dirty = false, timer = null;
function persist(){
  state.savedAt = Date.now();
  try { localStorage.setItem(LS,JSON.stringify(state)); } catch(e){}
  dirty = true; clearTimeout(timer); timer = setTimeout(flush,700);
}
async function flush(){
  if (!doc){ status = 'local'; paintStatus(); return; }
  if (saving){ timer = setTimeout(flush,400); return; }
  saving = true; dirty = false;
  try { await doc.set({json:JSON.stringify(state),savedAt:state.savedAt}); status = 'cloud'; }
  catch(e){ status = 'local'; }
  saving = false; paintStatus();
  if (dirty) flush();
}
function paintStatus(){
  const el = $('#status'); if (!el) return;
  el.textContent = status === 'cloud' ? 'Progresso salvo na sua conta' : 'Progresso salvo neste navegador';
}
async function initCloud(){
  try {
    if (!window.claude || !window.claude.use) return;
    const user = await window.claude.use('user');
    const db = await window.claude.use('db');
    if (!user || !db) return;
    const id = await user.id();
    if (!id) return;
    doc = db.doc('data/users/'+id+'/save');
    doc.onSnapshot(snap => {
      if (snap.exists){
        const d = snap.data();
        if (d && d.json && d.savedAt > (state.savedAt||0) && !snap.metadata.hasPendingWrites){
          try { state = normalize(JSON.parse(d.json)); localStorage.setItem(LS,JSON.stringify(state)); } catch(e){}
          render();
        }
        status = 'cloud';
      } else if (state.savedAt){ flush(); }
      else status = 'cloud';
      paintStatus();
    }, () => { status = 'local'; paintStatus(); });
  } catch(e){ status = 'local'; }
}

function ac(){
  try {
    if (!audioCtx){ const A = window.AudioContext || window.webkitAudioContext; if (A) audioCtx = new A(); }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  } catch(e){}
  return audioCtx;
}
function tone(freq,t0,dur,type,vol){
  const c = ac(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
  o.type = type || 'square'; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol || 0.07,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.03);
}

}

  /* dívida de estudo */
  const debt = SESS.filter(s => s.date < TODAY && !state.study[s.key]);
  if (debt.length){
    const show = debt.slice(-8).reverse();
    h += `<section class="win"><div class="sec-head"><h2>Dívida de estudo</h2><span class="meta">${debt.length} ${debt.length===1?'missão atrasada':'missões atrasadas'}</span></div><ul class="debt">`;
    show.forEach(s => {
      h += `<li><div><span class="when">${s.subj} · ${fmtD(s.date)}${s.boss?' · CHEFE':''}</span><span class="tx">${esc(s.text.split('\n')[0])}</span></div><button class="btn" data-act="pay" data-key="${s.key}">Pagar +${Math.round(s.xp*0.7)}</button></li>`;
    });
    h += `</ul>${debt.length>show.length?`<p class="note">Mais ${debt.length-show.length} mais antigas esperam por você. Pagar uma dívida rende 70% do XP.</p>`:''}</section>`;
  }

  /* mapa */
  h += `<section class="win"><div class="sec-head"><h2>Mapa da jornada</h2><span class="meta">15 capítulos</span></div><div class="map">`;
  for (let w = 1; w <= 15; w++){
    const ws = SESS.filter(s => s.k === w), dn2 = ws.filter(s => state.study[s.key]).length;
    const wStart = addDays(START,7*(w-1)), locked = wStart > TODAY;
    h += `<button class="node${dn2===ws.length?' full':''}${w===weekNo?' cur':''}${locked&&dn2===0?' lock':''}" data-act="week" data-w="${w}" aria-label="Capítulo ${w}: ${dn2} de ${ws.length} missões de estudo"><b>${w}</b><span>${dn2}/${ws.length}</span></button>`;
  }
  h += `</div><div class="bosses">`;
  [['1ª fase da OAB (48º Exame)',new Date(2027,0,10)],['Fim do cronograma de estudos',END],['2ª fase da OAB',new Date(2027,1,28)]].forEach(([n,dt]) => {
    const left = daysBetween(TODAY,dt);
    h += `<div><span class="bn">${n} · ${fmtD(dt)}/${dt.getFullYear()}</span><span class="bd">${left>0?'faltam '+left+' dias':left===0?'é hoje':'concluído'}</span></div>`;
  });
  h += `</div></section>`;

  h += `<section class="win"><details class="rules"><summary>Regras do jogo</summary><ul>
    <li>Cada missão cumprida rende XP. A missão principal vem do cronograma de estudos do dia e vale 80 XP, ou 120 XP quando é revisão ou simulado (chefe).</li>
    <li>Cair numa tentação tira XP e HP do dia. O HP volta a 100 no dia seguinte, mas o XP perdido não volta.</li>
    <li>Dias seguidos com 70% das missões e nenhuma queda formam uma sequência. Cada dia dá +5% de XP, até +50%.</li>
    <li>Dia perfeito (todas as missões e nenhuma queda) rende +50 XP.</li>
    <li>Missões de estudo atrasadas ficam na dívida e podem ser pagas depois por 70% do XP.</li>
    <li>O botão ✕ registra que você não fez uma missão. Ela não rende XP e não conta para os 70% da sequência.</li>
    <li>Side quests (terços e Consagração a São José) são bônus: rendem XP, mas não pesam na sequência nem no dia perfeito.</li>
    <li>Níveis: o nível N+1 começa em 60 × N × (N+1) de XP.</li></ul></details></section>`;

  h += `<footer class="foot"><span class="status" id="status"></span><button class="btn${resetArmed?' bad':''}" data-act="reset">${resetArmed?'Toque de novo para zerar tudo':'Zerar progresso'}</button></footer>`;

  $('#app').innerHTML = h;
  paintStatus();
}

/* ações */
function changeWith(fn,snd,msg){
  const kk = iso(sel);
  const b = compute(), lb = levelInfo(b.total).L, bp = !!(b.sums[kk] && b.sums[kk].perfect), bc = !!(b.sums[kk] && b.sums[kk].csFinal);
  fn(); persist();
  const a = compute(), la = levelInfo(a.total), ap = !!(a.sums[kk] && a.sums[kk].perfect), cc = !!(a.sums[kk] && a.sums[kk].csFinal);
  const delta = a.total - b.total;
  render();
  if (la.L > lb){ sfx('level'); toast('NÍVEL '+la.L+'! '+la.title,'lvl'); }
  else if (cc && !bc){ sfx('level'); toast('Consagração concluída! +'+CONSAG_BONUS+' XP','lvl'); }
  else if (ap && !bp){ sfx('perfect'); toast('Dia perfeito! +50 XP','lvl'); }
  else {
    if (snd) sfx(snd);
    if (delta !== 0) toast((delta>0?'+':'−')+fmtN(Math.abs(delta))+' XP',delta>0?'':'neg');
    else if (msg) toast(msg,'neg');
  }
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'INPUT') return;
  const a = b.dataset.act, k = iso(sel);
  if (a === 'sound'){
    soundOn = !soundOn;
    try { localStorage.setItem(LS+'-snd', soundOn ? 'on' : 'off'); } catch(e){}
    render(); sfx('coin');
  }
  else if (a === 'miss'){
    if (sel > TODAY) return;
    const id = b.dataset.id, was = (state.q[k] || {})[id] === 2;
    changeWith(() => {
      const m = state.q[k] = state.q[k] || {};
      if (was) delete m[id];
      else { m[id] = 2; if (b.dataset.kind === 'study' && state.study[b.dataset.key] === k) delete state.study[b.dataset.key]; }
    }, was ? 'undo' : 'hit', was ? '' : 'Marcada como não feita');
  }
  else if (a === 'prev'){ sel = clampD(addDays(sel,-1)); render(); }
  else if (a === 'next'){ sel = clampD(addDays(sel,1)); render(); }
  else if (a === 'today'){ sel = clampD(TODAY); render(); }
  else if (a === 'week'){ sel = clampD(addDays(START,7*(Number(b.dataset.w)-1))); render(); window.scrollTo({top:0}); }
  else if (a === 'vice' || a === 'unvice'){
    if (sel > TODAY) return;
    changeWith(() => {
      const m = state.vice[k] = state.vice[k] || {};
      m[b.dataset.id] = Math.max(0,(m[b.dataset.id]||0) + (a === 'vice' ? 1 : -1));
      if (!m[b.dataset.id]) delete m[b.dataset.id];
    }, a === 'vice' ? 'hit' : 'undo');
  }
  else if (a === 'vicedel'){
    const v = state.viceDefs.find(x => x.id === b.dataset.id);
    if (v){ v.hidden = true; persist(); render(); }
  }
  else if (a === 'pay'){
    changeWith(() => { state.study[b.dataset.key] = iso(TODAY); },'coin');
  }
  else if (a === 'reset'){
    if (!resetArmed){ resetArmed = true; render(); setTimeout(() => { resetArmed = false; render(); },4000); }
    else { resetArmed = false; state = fresh(); persist(); render(); toast('Jogo zerado','neg'); }
  }
});
document.addEventListener('change', e => {
  const t = e.target; if (!t.matches || !t.matches('input[data-act]')) return;
  const k = iso(sel);
  if (sel > TODAY){ render(); return; }
  if (t.dataset.act === 'q'){
    changeWith(() => {
      const m = state.q[k] = state.q[k] || {};
      if (t.checked) m[t.dataset.id] = 1; else delete m[t.dataset.id];
    }, t.checked ? 'coin' : 'undo');
  } else if (t.dataset.act === 'study'){
    changeWith(() => {
      if (t.checked){ state.study[t.dataset.key] = k; if (state.q[k]) delete state.q[k]['S'+t.dataset.key]; } else delete state.study[t.dataset.key];
    }, t.checked ? (SBK[t.dataset.key].boss ? 'boss' : 'coin') : 'undo');
  }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'vform') return;
  e.preventDefault();
  const name = $('#vname').value.trim(); if (!name) return;
  const xp = Number($('#vxp').value) || 20;
  state.viceDefs.push({id:'c'+Date.now().toString(36),name,xp,hp:Math.round(xp*0.75)});
  persist(); render();
});

render();
initCloud();
</script>
